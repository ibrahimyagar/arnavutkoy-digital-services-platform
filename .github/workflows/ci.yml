name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ArnavutkoyBelediyesi.slnx

      - name: Build
        run: dotnet build ArnavutkoyBelediyesi.slnx -c Release --no-restore

      - name: Test with coverage
        # Testcontainers, GitHub Actions runner üzerindeki Docker daemon'ını kullanır.
        # Coverlet (XPlat Code Coverage) Cobertura raporu üretir; eşik zorunlu değildir —
        # anlamlı senaryo kapsamı birincil kalite kapısıdır (bkz. docs/TESTING.md).
        run: >
          dotnet test ArnavutkoyBelediyesi.slnx
          -c Release
          --no-build
          --verbosity normal
          --collect:"XPlat Code Coverage"
          --results-directory ./coverage
          --
          DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: coverage/**
          if-no-files-found: warn
          retention-days: 14

  web-build:
    name: Web Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

  docker-image:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-test, web-build]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          tags: arnavutkoy-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
