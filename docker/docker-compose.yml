services:
  db:
    image: postgres:16-alpine
    container_name: arnavutkoy-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arnavutkoy}
      POSTGRES_USER: ${POSTGRES_USER:-arnavutkoy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - arnavutkoy-net

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: arnavutkoy-api:local
    container_name: arnavutkoy-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ASPNETCORE_URLS: http://+:8080
      DISABLE_HTTPS_REDIRECTION: "true"
      ConnectionStrings__Default: >-
        Host=db;Port=5432;Database=${POSTGRES_DB:-arnavutkoy};Username=${POSTGRES_USER:-arnavutkoy};Password=${POSTGRES_PASSWORD};Include Error Detail=true
      Jwt__Issuer: ${JWT_ISSUER:-ArnavutkoyBelediyesi.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-ArnavutkoyBelediyesi.Client}
      Jwt__AccessTokenLifetimeMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      Jwt__RefreshTokenLifetimeDays: ${JWT_REFRESH_TOKEN_DAYS:-7}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be at least 32 characters}
      Database__SeedOnStartup: ${DATABASE_SEED_ON_STARTUP:-true}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
    ports:
      - "${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    networks:
      - arnavutkoy-net

volumes:
  pgdata:

networks:
  arnavutkoy-net:
    name: arnavutkoy-net
